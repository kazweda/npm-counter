name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        multisite: ['0']
        include:
          - php: '8.4'
            multisite: '1'

    name: PHP ${{ matrix.php }}${{ matrix.multisite == '1' && ' (multisite)' || '' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_MULTISITE: ${{ matrix.multisite }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install Subversion
        run: command -v svn || (sudo apt-get update && sudo apt-get install -y subversion)

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest true

      - name: Run PHPUnit
        run: vendor/bin/phpunit
